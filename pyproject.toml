[project]
name = "gemini-live-ptt"
version = "0.1.0"
description = "Push-to-talk demo for Gemini Live via Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.25,<2",
    "google-genai",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
